<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta property="og:title" content="Home | berenson.dev" />
		<meta
			property="og:description"
			content="Spencer Berenson's personal site."
		/>
		<title>Home | berenson.dev</title>

		<link
			rel="stylesheet"
			href="https://unpkg.com/modern-normalize@3.0.1/modern-normalize.css"
		/>
		<style>
			:root {
				--background-color: #fff;
				--text-color: #000;
			}

			body {
				position: fixed;
				bottom: 0;
				left: 0;

				padding: 8px;

				font-family: monospace;
				color: var(--text-color);
				background-color: var(--background-color);
			}

			h1,
			h2 {
				font-size: inherit;
				font-weight: inherit;
			}

			.link {
				color: var(--text-color);
			}

			.link--heading {
				text-decoration-style: dashed;
			}

			.link:not(.link--heading):hover,
			.link:not(.link--heading):focus-visible {
				text-decoration-thickness: 2px;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--text-color: #fff;
					--background-color: #000;
				}
			}
		</style>
	</head>
	<body>
		<h1>Spencer Berenson</h1>
		<h2>
			Software Engineer,
			<a
				class="link link--heading"
				href="//desmos.com"
				target="_blank"
				rel="noreferrer noopener"
				>Desmos Studio PBC</a
			>
		</h2>

		<a
			class="link"
			href="//github.com/slbls"
			target="_blank"
			rel="noreferrer noopener"
			>GitHub</a
		>
		<a
			class="link"
			href="//linkedin.com/in/spencer-berenson"
			target="_blank"
			rel="noreferrer noopener"
			>LinkedIn</a
		>
		<a class="link" href="mailto:spencer@berenson.dev">Email</a>
	</body>
</html>
